<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <meta name="description" content="A calm, focused space to keep track of what matters today.">
    <title>Daymark — a little more focus</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/index.js" defer></script>
  </head>
  <body data-api="/api/todos">
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Daymark home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></svg>
          </span>
          <span>daymark</span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> Your day, in good order</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A FRESH START, EVERY DAY</p>
        <h1 id="page-title">Make room for <span>what matters.</span></h1>
        <p class="intro-copy">A little clarity goes a long way. Get it out of your head and onto your list.</p>
      </section>

      <section class="task-card" aria-label="Your tasks">
        <form class="task-form" id="todoForm">
          <label class="sr-only" for="taskInput">What needs to get done?</label>
          <span class="input-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </span>
          <input id="taskInput" name="task" type="text" maxlength="240" placeholder="What needs to get done?" autocomplete="off" required>
          <button class="add-button" type="submit"><span>Add task</span><span class="add-arrow" aria-hidden="true">↵</span></button>
        </form>

        <div class="list-toolbar">
          <div class="list-heading">
            <h2>Tasks</h2>
            <span class="task-count" id="taskCount">0</span>
          </div>
          <div class="filter-tabs" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-button is-active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-button" data-filter="active" aria-pressed="false">To do</button>
            <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
        </div>

        <ul class="task-list" id="taskList" aria-label="Task list" aria-live="polite"></ul>

        <div class="list-footer">
          <span id="remainingCount">Nothing on your plate</span>
          <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="progress-fill" id="progressFill"></span>
          </div>
          <span class="progress-label" id="progressLabel">0% complete</span>
        </div>
      </section>

      <p class="page-note"><span aria-hidden="true">✦</span> One thing at a time is still progress.</p>
      <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
